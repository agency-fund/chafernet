#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
hooks = [
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "destroyed-symlinks" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "46787482b9fb2003c56e0f7592e312ef381829d9"  # frozen: 0.13.6
hooks = [
  { id = "uv-lock" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c"  # frozen: v0.17.3
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f"  # frozen: v1.31.1
hooks = [
  { id = "zizmor" },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "b0cff962ee693b9e612c097d22e71e0cba127447"  # frozen: v0.3.2
hooks = [
  { id = "rumdl-fmt" },
  { id = "rumdl-check" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --all",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
  },
  {
    # Regenerates the READMEs (`task readme`), failing the commit if any was out of date.
    id = "readmes",
    name = "READMEs and crate docs generated from gendocs/",
    entry = "tools/gen_readmes.py",
    language = "system",
    files = '^(gendocs/|tools/gen_readmes\.py|README\.md$|chafernet/README\.md$|python/README\.md$|chafernet/src/crate-docs\.md$|Cargo\.toml$|pyproject\.toml$)',
    pass_filenames = false,
  },
]
