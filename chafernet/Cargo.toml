[package]
name = "chafernet"
description = "Authenticated, encrypted, timestamped tokens using XChaCha20-Poly1305, for Python and Rust."
keywords = ["fernet", "token", "xchacha20", "aead", "encryption"]
categories = ["cryptography", "encoding"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
zeroize = { version = "1", features = ["derive", "serde"] }

[features]
wasm_js = ["getrandom/wasm_js", "dep:js-sys"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", default-features = false }
js-sys = { version = "0.3", default-features = false, optional = true }
