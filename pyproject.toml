[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "chafernet"
description = "Authenticated, encrypted, timestamped tokens using XChaCha20-Poly1305, for Python and Rust."
readme = "python/README.md"
license = "MIT"
requires-python = ">=3.14"
keywords = ["fernet", "token", "xchacha20", "aead", "encryption"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/agency-fund/chafernet"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "maturin>=1.9.4,<2",
    "coverage>=7",
    "mypy>=1.19",
    "prek>=0.5.9",
    "pytest>=8",
]

[tool.coverage.run]
source = ["python/chafernet"]

[tool.coverage.report]
show_missing = true

[tool.maturin]
manifest-path = "python/Cargo.toml"
python-source = "python"
module-name = "chafernet._chafernet"

[tool.ruff]
line-length = 120
target-version = "py314"
# Generated by `task stubs`.
extend-exclude = ["python/chafernet/_chafernet.pyi"]

[tool.ruff.lint.isort]
known-first-party = ["chafernet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
