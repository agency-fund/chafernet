# The tools most jobs need, each pinned here once: the Rust toolchain that rust-toolchain.toml names, uv, and Task.
# A job turns off what it doesn't use. Jobs refer to it as $/.github/actions/setup, the form GitHub treats as pinned.
name: Set up Rust, uv, and Task
description: Installs the Rust toolchain from rust-toolchain.toml, uv, and Task
inputs:
  rust:
    description: Install the Rust toolchain that rust-toolchain.toml names
    default: "true"
  uv:
    description: Install uv
    default: "true"
  task:
    description: Install Task
    default: "true"
runs:
  using: composite
  steps:
    - if: inputs.rust == 'true'
      shell: bash
      run: rustup toolchain install --no-self-update
    - if: inputs.uv == 'true'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false
    - if: inputs.task == 'true'
      uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        version: 3.54.0
