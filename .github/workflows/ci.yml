on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    outputs:
      full: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}
      code: ${{ steps.code.outputs.code }}
      packaging: ${{ steps.packaging.outputs.packaging }}
      tagged: ${{ steps.release.outputs.tagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A release pushes its commit and its v* tag together, which starts a run for each. The tag's run checks
      # everything, so the branch's run of the same commit does nothing: the filters below are skipped, which leaves
      # their outputs empty.
      - name: Leave a release commit to its tag's run
        id: release
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "tagged=true" >> "${GITHUB_OUTPUT}"
          fi
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: code
        if: github.event_name == 'push' && github.ref_type == 'branch' && steps.release.outputs.tagged != 'true'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!.changes/**"
              - "!gendocs/**"
              - "!CHANGELOG.md"
              - "!CONTRIBUTING.md"
              - "!README.md"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: packaging
        if: github.event_name == 'push' && github.ref_type == 'branch' && steps.release.outputs.tagged != 'true'
        with:
          filters: |
            packaging:
              - .github/workflows/ci.yml
              - pyproject.toml
              - Cargo.toml
              - chafernet/Cargo.toml
              - python/Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - Taskfile.yml

  lint:
    needs: changes
    if: needs.changes.outputs.tagged != 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: task setup lint
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}

  msrv:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          rust: false
          uv: false
      - run: task msrv

  # The Rust crate on WebAssembly: built for browsers (wasm32-unknown-unknown, where randomness needs the wasm_js
  # feature), and its tests run on WASI (wasm32-wasip2) under wasmtime.
  wasm:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          uv: false
      - run: rustup target add wasm32-unknown-unknown wasm32-wasip2
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasmtime@50.0.1
      - run: task test:wasm

  # Checks that CHANGELOG.md is what changie generates from .changes/, so that changes go in fragments rather than
  # direct edits (see CONTRIBUTING.md).
  changelog:
    needs: changes
    if: needs.changes.outputs.tagged != 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install changie
        env:
          CHANGIE_VERSION: 1.26.0
          # The SHA-256 of changie_${CHANGIE_VERSION}_linux_arm64.tar.gz, from the release's checksums.txt. Bump the two
          # together.
          CHANGIE_SHA256: ec1e542014b5134f1cf86b3a12e86d566ab5ec9bd3901bf66f42a09cd9865b6e
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/changie.tar.gz" \
            "https://github.com/miniscruff/changie/releases/download/v${CHANGIE_VERSION}/changie_${CHANGIE_VERSION}_linux_arm64.tar.gz"
          echo "${CHANGIE_SHA256}  ${RUNNER_TEMP}/changie.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/changie.tar.gz" -C "${RUNNER_TEMP}/bin" changie
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - uses: $/.github/actions/setup
        with:
          rust: false
          uv: false
      - run: task changelog:check

  test:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["ubuntu-26.04", "ubuntu-26.04-arm"]' || '["ubuntu-26.04-arm"]') }}
        python: ["3.14", "3.14t", "3.15", "3.15t"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - if: matrix.python == '3.14'
        run: task test:rust
      - run: task setup build
        env:
          PYTHON: ${{ matrix.python }}
      - run: task test:python -- -v
        env:
          HYPOTHESIS_PROFILE: ci

  coverage:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov
      - run: task setup coverage
        env:
          PYTHON: "3.15"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/

  wheels:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.packaging == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, target: x86_64, runner: ubuntu-26.04, manylinux: "2_28" }
          - { platform: linux, target: aarch64, runner: ubuntu-26.04-arm, manylinux: "2_28" }
          - { platform: musllinux, target: x86_64, runner: ubuntu-26.04, manylinux: musllinux_1_2 }
          - { platform: musllinux, target: aarch64, runner: ubuntu-26.04-arm, manylinux: musllinux_1_2 }
          - { platform: macos, target: x86_64, runner: macos-26-intel }
          - { platform: macos, target: aarch64, runner: macos-26 }
          - { platform: windows, target: x64, runner: windows-2025 }
          - { platform: windows, target: aarch64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # For the attest step: a signing certificate, and storing the attestation and its record.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          rust: false
          task: ${{ matrix.platform != 'windows' }}
      - if: matrix.platform == 'macos'
        run: |
          uv python install 3.14 3.14t 3.15 3.15t
          uv python dir --bin >> "$GITHUB_PATH"
      # Windows has no python3.14-style names on PATH, so maturin is given each interpreter's path.
      - name: Find the Pythons
        id: pythons
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          uv python install 3.14 3.14t 3.15 3.15t
          args=""
          for python in 3.14 3.14t 3.15 3.15t; do
            args+=" -i $(uv python find --managed-python --no-project "${python}")"
          done
          echo "args=${args}" >> "$GITHUB_OUTPUT"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist ${{ steps.pythons.outputs.args || '-i python3.14 -i python3.14t -i python3.15 -i python3.15t' }}
          manylinux: ${{ matrix.manylinux }}
      - name: Test each wheel
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        env:
          HYPOTHESIS_PROFILE: ci
        run: task release:test PYTHONS="3.14 3.14t 3.15 3.15t"
      # The runner's glibc can't load a musllinux wheel, so the tests run in an Alpine container.
      - name: Test each wheel on Alpine
        if: matrix.platform == 'musllinux'
        env:
          HYPOTHESIS_PROFILE: ci
        run: task release:test:musl
      # Not `task release:test`: its venv has no bin/python on Windows.
      - name: Test each wheel on Windows
        if: matrix.platform == 'windows'
        shell: bash
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          for python in 3.14 3.14t 3.15 3.15t; do
            venv="${RUNNER_TEMP}/venv-${python}"
            uv venv --quiet --python "${python}" "${venv}"
            uv pip install --quiet --python "${venv}" --no-index --find-links dist chafernet
            uv pip install --quiet --python "${venv}" pytest hypothesis
            uv run --no-project --python "${venv}" python -m pytest -q -p no:cacheprovider
          done
      # Signs a statement that this run built these files from this tag; publish.yml refuses files without one.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.target }}
          path: dist

  sdist:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    # For the attest step: a signing certificate, and storing the attestation and its record.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # maturin sdist and uv's build of the project's metadata run cargo metadata.
      - uses: $/.github/actions/setup
      - run: task setup sdist
      - name: Install from the sdist and test
        env:
          HYPOTHESIS_PROFILE: ci
        run: task release:test PYTHONS=3.15
      # Signs a statement that this run built these files from this tag; publish.yml refuses files without one.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  # On a v* tag, once everything has passed, checks the tag against the version and the registries, and puts the
  # wheels, the sdist, and their SHA256SUMS in a draft GitHub release. Publishing that release on GitHub runs
  # publish.yml, which uploads exactly these files to PyPI and publishes the crate. A re-run replaces the draft; a
  # published release is never touched. Only the tag's push does this, not a manual run on the tag, so that two runs
  # never replace the draft at once.
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [lint, msrv, changelog, test, wasm, wheels, sdist]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    # contents to create the release; the rest for the attest step.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          rust: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # Stops the release if PyPI or crates.io already has this version: publish.yml would then upload only to the
      # other registry, and the two would hold different code under the same version number.
      - run: task release:preflight
        env:
          TAG: ${{ github.ref_name }}
      - run: uvx --from "twine>=6,<7" twine check --strict dist/*
      - run: task release:draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
      # The build jobs attest each file as soon as it is built. This attests the list of them, and only here, after
      # every check has passed: publish.yml refuses a release whose SHA256SUMS lacks it, so files from a run that
      # failed, or a draft with files removed, can't be published.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: SHA256SUMS
