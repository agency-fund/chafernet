# $schema: https://taskfile.dev/schema.json
# The development commands, run with Task (https://taskfile.dev): `task --list` shows them. CI runs these same tasks.
# Tasks named ci:* are meant to run only in CI, where the credentials they need exist.
version: "3"

vars:
  # The Python that `setup` puts in .venv; `task setup PYTHON=3.15t` picks another.
  PYTHON: '{{.PYTHON | default "3.14"}}'
  # The Rust version Cargo.toml promises, which `msrv` builds with.
  MSRV:
    sh: sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml
  # The Python in .venv, as uv names it (3.14, 3.15t, ...), or PYTHON if there is no .venv.
  VENV_PYTHON:
    sh: test -x .venv/bin/python && .venv/bin/python -c "import sys, sysconfig; print(f'{sys.version_info[0]}.{sys.version_info[1]}' + ('t' if sysconfig.get_config_var('Py_GIL_DISABLED') else ''))" || echo {{.PYTHON}}
  # Where the state (terraform.tfstate) and the variables (terraform.tfvars) of .github/tf/gh.tf are kept, outside the
  # repository; `task gh:init TF_DIR=../elsewhere` picks another directory. A relative path starts at the repository.
  TF_DIR: '{{.TF_DIR | default "../tf/chafernet"}}'
  # TF_DIR as an absolute path, because tofu runs in .github/tf.
  TF_PATH: '{{if isAbs .TF_DIR}}{{.TF_DIR}}{{else}}{{joinPath .ROOT_DIR .TF_DIR}}{{end}}'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: Create .venv with the development dependencies (PYTHON selects the interpreter)
    cmds:
      - uv sync --python {{.PYTHON}} --group dev --no-install-project

  build:
    desc: Build the extension module into .venv, in release mode
    cmds:
      - .venv/bin/maturin develop --release --uv

  build:debug:
    desc: Build the extension module into .venv with debug assertions
    cmds:
      - .venv/bin/maturin develop --uv

  test:
    desc: >-
      Run the Rust tests, natively and on WebAssembly, rebuild the extension with debug assertions, and run the Python
      tests; needs the wasm targets and wasmtime (arguments after -- go to pytest)
    cmds:
      - task: test:rust
      - task: test:wasm
      - task: build:debug
      - task: test:python

  test:rust:
    desc: Run the Rust crate's tests; needs no Python
    cmds:
      - cargo test -p chafernet

  test:wasm:
    desc: >-
      Build the Rust crate for WebAssembly in a browser (wasm32-unknown-unknown, with the wasm_js feature) and run its
      tests on WASI (wasm32-wasip2) under wasmtime; needs those Rust targets and wasmtime
    preconditions:
      - sh: rustup target list --installed | grep -qx wasm32-unknown-unknown && rustup target list --installed | grep -qx wasm32-wasip2
        msg: 'Add the targets: rustup target add wasm32-unknown-unknown wasm32-wasip2'
      - sh: command -v wasmtime
        msg: wasmtime is not installed (https://wasmtime.dev)
    env:
      CARGO_TARGET_WASM32_WASIP2_RUNNER: wasmtime
    cmds:
      - cargo build --locked -p chafernet --target wasm32-unknown-unknown --features wasm_js
      - cargo test --locked -p chafernet --target wasm32-wasip2

  test:python:
    desc: >-
      Run the Python tests on the build that is in .venv, without rebuilding it; `task test` rebuilds first
      (HYPOTHESIS_PROFILE=ci or thorough searches harder; arguments after -- go to pytest)
    preconditions:
      - sh: .venv/bin/python -c "import chafernet._chafernet"
        msg: 'The extension is not built into .venv: run `task build` or `task test`'
    cmds:
      - .venv/bin/python -m pytest {{.CLI_ARGS}}
      - .venv/bin/python -m doctest python/README.md python/chafernet/__init__.py

  coverage:
    desc: Measure test coverage into coverage/ (Rust from the Rust and Python tests, Python from the Python tests); leaves an instrumented debug build in .venv, so run `task build` afterwards
    env:
      HYPOTHESIS_PROFILE: '{{.HYPOTHESIS_PROFILE | default "ci"}}'
    cmds:
      - |
        set -e
        eval "$(cargo llvm-cov show-env --sh)"
        cargo llvm-cov clean --workspace
        cargo test -p chafernet
        .venv/bin/maturin develop --uv
        rm -rf coverage && mkdir coverage
        .venv/bin/python -m coverage run -m pytest -q
        cargo llvm-cov report --lcov --output-path coverage/rust.lcov
        cargo llvm-cov report --html --output-dir coverage/rust
        cargo llvm-cov report --summary-only
        .venv/bin/python -m coverage html -q -d coverage/python
        .venv/bin/python -m coverage xml -q -o coverage/python.xml
        .venv/bin/python -m coverage report

  stubs:
    desc: Regenerate python/chafernet/_chafernet.pyi from the extension's Rust source (pyo3's type stub generation)
    cmds:
      - task: stubs:generate
      - cp .venv/stubs/chafernet/_chafernet.pyi python/chafernet/_chafernet.pyi

  stubs:check:
    desc: Check that python/chafernet/_chafernet.pyi matches what `task stubs` generates
    cmds:
      - task: stubs:generate
      - diff -u python/chafernet/_chafernet.pyi .venv/stubs/chafernet/_chafernet.pyi

  stubs:generate:
    internal: true
    cmds:
      - rm -rf .venv/stubs
      # With the oldest supported Python, so that the stub is valid for every version (see pyo3's type-stub guide).
      - .venv/bin/maturin generate-stubs --quiet --out .venv/stubs --interpreter .venv/bin/python
      # A header, and pyo3 writes the annotations given in `signature = (...)` as string literals; they are plain
      # names. sed -i is avoided because GNU's and macOS's take different arguments.
      - |
        stub=.venv/stubs/chafernet/_chafernet.pyi
        { echo '# Generated from the Rust source by `task stubs`; do not edit.'; sed -E 's/: "([A-Za-z_| ]+)"/: \1/g' "${stub}"; } > "${stub}.new"
        mv "${stub}.new" "${stub}"

  lint:
    desc: Run every check CI's lint job runs; needs .venv, from `task setup`
    cmds:
      - task: lint:rust
      - task: lint:prek
      - task: lint:types
      - task: stubs:check

  lint:rust:
    desc: cargo fmt and clippy, rustdoc with warnings denied, and a cargo publish dry run
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo doc -p chafernet --no-deps
      - cargo publish -p chafernet --dry-run --allow-dirty

  lint:prek:
    desc: Run the prek hooks in prek.toml (ruff, rumdl, file hygiene, uv.lock, zizmor, the READMEs) on every file
    cmds:
      - .venv/bin/prek run --all-files

  lint:types:
    desc: Type-check the Python package (the generated stub and __init__.py) with mypy
    cmds:
      - .venv/bin/python -m mypy --strict python/chafernet

  msrv:
    desc: Check that the workspace builds with the minimum supported Rust version
    env:
      # Overrides rust-toolchain.toml for every command here. `cargo +` overrides it for cargo, but newer rustups
      # (1.29) would otherwise install the toolchain the file pins when `rustup toolchain list` runs.
      RUSTUP_TOOLCHAIN: '{{.MSRV}}'
    cmds:
      - rustup toolchain list | grep -q '^{{.MSRV}}' || rustup toolchain install {{.MSRV}} --profile minimal
      - cargo +{{.MSRV}} check --workspace --all-targets

  changelog:new:
    desc: >-
      Add a changelog fragment under .changes/unreleased/ (needs changie); prompts for the kind and body, or pass them
      after --, e.g. task changelog:new -- -k Fixed -b "One-line body."
    preconditions: &changie
      - sh: command -v changie
        msg: changie is not installed (https://changie.dev)
    cmds:
      - changie new {{.CLI_ARGS}}

  changelog:merge:
    desc: Regenerate CHANGELOG.md from .changes/ (needs changie)
    preconditions: *changie
    cmds:
      - changie merge

  changelog:check:
    desc: Check that CHANGELOG.md matches what `task changelog:merge` generates (needs changie)
    preconditions: *changie
    cmds:
      - |
        changie merge --dry-run | diff -u CHANGELOG.md - || {
          echo 'CHANGELOG.md is out of sync with .changes/: add a fragment with `task changelog:new` rather than editing it, and run `task changelog:merge` after editing .changes/.' >&2
          exit 1
        }

  changelog:batch:
    desc: >-
      At release time, roll the fragments in .changes/unreleased/ into .changes/VERSION.md and regenerate CHANGELOG.md
      (needs changie): give the new version, e.g. task changelog:batch -- 0.2.0, or patch, minor, or major to increment
      the last one; edit the new file if needed, then run task changelog:merge
    preconditions: *changie
    cmds:
      # With no version to increment, changie names the first one with a "v", unlike the versions given as numbers.
      - cmd: |
          if ! ls .changes/[0-9]*.md >/dev/null 2>&1 && ! printf '%s' '{{.CLI_ARGS}}' | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo 'The first release has no version to increment: give its number, e.g. task changelog:batch -- 0.1.0' >&2
            exit 1
          fi
        silent: true
      - changie batch {{.CLI_ARGS}}
      - changie merge

  fmt:
    desc: Format the Rust, Python, and Markdown files, with the same tools and versions as the prek hooks
    cmds:
      - cargo fmt --all
      - cmd: .venv/bin/prek run ruff-format --all-files
        ignore_error: true
      - cmd: .venv/bin/prek run ruff-check --all-files
        ignore_error: true
      - cmd: .venv/bin/prek run rumdl-fmt --all-files
        ignore_error: true

  readme:
    desc: >-
      Regenerate README.md, chafernet/README.md, python/README.md, and the crate docs (chafernet/src/crate-docs.md) from
      the templates in gendocs/
    cmds:
      - tools/gen_readmes.py

  sdist:
    desc: Build the source distribution into dist/
    cmds:
      - .venv/bin/maturin sdist --out dist

  release:test:
    desc: >-
      Install chafernet from dist/ into a fresh venv for each Python in PYTHONS (default, the Python in .venv) and run
      the tests on it: from the wheel that fits, or from the sdist when dist/ holds no wheels
    vars:
      PYTHONS: '{{.PYTHONS | default .VENV_PYTHON}}'
    cmds:
      - for: { var: PYTHONS, split: " " }
        cmd: |
          # In TMPDIR, or /tmp without one, and removed afterwards.
          venv="$(mktemp -d)"
          trap 'rm -rf "${venv}"' EXIT
          uv venv --quiet --python {{.ITEM}} --clear "${venv}"
          # --no-cache: uv otherwise serves a cached build with the same file name, from an earlier build of this
          # version. --no-index: a wheel comes from dist/ and nowhere else. An sdist needs its build tools from PyPI.
          if ls dist/*.whl >/dev/null 2>&1; then
            uv pip install --quiet --no-cache --python "${venv}" --no-index --find-links dist chafernet
          else
            uv pip install --quiet --no-cache --python "${venv}" dist/*.tar.gz
          fi
          uv pip install --quiet --python "${venv}" pytest hypothesis
          "${venv}/bin/python" -m pytest -q -p no:cacheprovider

  release:test:musl:
    desc: >-
      Run the tests on the musllinux wheel in dist/ inside Alpine Linux (needs Docker), for each Python in PYTHONS
      (default, every Python the wheels are built for)
    vars:
      PYTHONS: '{{.PYTHONS | default "3.14 3.14t 3.15 3.15t"}}'
      # uv's Alpine image, by digest, so that the test environment changes only when this line does. uv installs a
      # musl build of each Python in it.
      IMAGE: ghcr.io/astral-sh/uv:0.13.5-alpine@sha256:6ba9c830aa848d21e1e9d8028ae01ed02b08980b25aeabef9a6683c5743c6d0f
    cmds:
      - |
        docker run --rm -e HYPOTHESIS_PROFILE \
          -v "$PWD/dist:/w/dist:ro" -v "$PWD/tests:/w/tests:ro" -v "$PWD/pyproject.toml:/w/pyproject.toml:ro" \
          -w /w {{.IMAGE}} sh -euc '
            for python in {{.PYTHONS}}; do
              venv="/tmp/venv-${python}"
              uv venv --quiet --python "${python}" "${venv}"
              uv pip install --quiet --python "${venv}" --no-index --find-links dist chafernet
              uv pip install --quiet --python "${venv}" pytest hypothesis
              "${venv}/bin/python" -m pytest -q -p no:cacheprovider
            done'

  release:tag:
    desc: >-
      After `task changelog:batch -- X.Y.Z`: set that version in Cargo.toml and Cargo.lock, run `task lint test`,
      commit the version with the changelog as "Release X.Y.Z", and tag the commit vX.Y.Z (needs changie); pushes
      nothing
    preconditions: *changie
    silent: true
    cmds:
      - |
        set -eu
        version="$(changie latest --remove-prefix)"
        if [ ! -f ".changes/${version}.md" ] || git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
          echo "Nothing to release: run \`task changelog:batch -- X.Y.Z\` first (the latest version in .changes/ is ${version})" >&2
          exit 1
        fi
        # Only the changelog may have uncommitted changes, so that the release commit holds nothing else.
        other="$(git status --porcelain --untracked-files=no | grep -Ev '^.. (\.changes/|CHANGELOG\.md$)' || true)"
        if [ -n "${other}" ]; then
          printf 'Commit or stash these first:\n%s\n' "${other}" >&2
          exit 1
        fi
        changie merge --dry-run | diff -q CHANGELOG.md - >/dev/null || {
          echo 'CHANGELOG.md is out of sync with .changes/: run `task changelog:merge`' >&2
          exit 1
        }
        # The file becomes the notes of the GitHub release, and changie writes each entry as a list item.
        if ! grep -q '^- ' ".changes/${version}.md"; then
          echo ".changes/${version}.md has no entries, so the release would have no notes: write them in it and run \`task changelog:merge\`" >&2
          exit 1
        fi
        # A branch that is behind its remote can't be pushed, and by then the tag would exist.
        if git rev-parse -q --verify '@{upstream}' >/dev/null; then
          git fetch --quiet
          if [ -n "$(git rev-list -n 1 'HEAD..@{upstream}')" ]; then
            echo "$(git branch --show-current) is behind its remote: pull first" >&2
            exit 1
          fi
        fi
        # From here until the commit, a failure puts the version back, so that the task can be run again.
        trap 'git checkout --quiet -- Cargo.toml Cargo.lock' EXIT
        # The one version in Cargo.toml: `version` under [workspace.package], which both crates inherit.
        # Not sed -i: GNU's and macOS's take different arguments.
        sed -E "s/^(version = )\"[^\"]*\"/\1\"${version}\"/" Cargo.toml > Cargo.toml.new && mv Cargo.toml.new Cargo.toml
        grep -qx "version = \"${version}\"" Cargo.toml
        # Not an update of the dependencies: --workspace rewrites only the workspace's own packages in the lock
        # file, which records their version, and CI builds with --locked.
        cargo update --quiet --workspace
        # What CI will check on the tag, checked here first, on the tree that is about to be tagged.
        task lint test
        git add -- .changes CHANGELOG.md Cargo.toml Cargo.lock
        git commit --quiet -m "Release ${version}"
        trap - EXIT
        git tag -a "v${version}" -m "chafernet ${version}"
        echo "Committed and tagged v${version}. Review it with \`git show\`, then push the commit and the tag together:"
        echo "  git push --atomic origin $(git branch --show-current) v${version}"

  release:preflight:
    desc: Check that TAG (e.g. v1.2.0) names the version in Cargo.toml and that neither PyPI nor crates.io has it yet
    silent: true
    requires:
      vars: [TAG]
    env:
      TAG: '{{.TAG}}'
    cmds:
      - |
        version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
        if [ "${TAG}" != "v${version}" ]; then
          echo "::error::The tag ${TAG} does not match the version ${version} in Cargo.toml"
          exit 1
        fi
        status() { curl -sS -o /dev/null -w '%{http_code}' -A "chafernet-ci (https://github.com/agency-fund/chafernet)" "$1"; }
        case "$(status "https://pypi.org/pypi/chafernet/${version}/json")" in
          404) ;;
          200) echo "::error::chafernet ${version} is already on PyPI"; exit 1 ;;
          *) echo "::error::Could not ask PyPI whether it has chafernet ${version}"; exit 1 ;;
        esac
        case "$(status "https://crates.io/api/v1/crates/chafernet/${version}")" in
          404) ;;
          200) echo "::error::chafernet ${version} is already on crates.io"; exit 1 ;;
          *) echo "::error::Could not ask crates.io whether it has chafernet ${version}"; exit 1 ;;
        esac
        echo "chafernet ${version} is on neither PyPI nor crates.io"

  release:draft:
    desc: >-
      Put the files in dist/ and their SHA256SUMS in a draft GitHub release for TAG, replacing an earlier draft, with
      .changes/VERSION.md as the notes (needs gh); CI runs it on a v* tag
    silent: true
    requires:
      vars: [TAG]
    env:
      TAG: '{{.TAG}}'
    cmds:
      - |
        (cd dist && sha256sum -- * > ../SHA256SUMS)
        case "$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null)" in
          true) gh release delete "${TAG}" --yes ;;
          false) echo "::error::The release ${TAG} is already published"; exit 1 ;;
        esac
        notes=".changes/${TAG#v}.md"
        if [ -f "${notes}" ]; then
          gh release create "${TAG}" --draft --verify-tag --title "${TAG}" --notes-file "${notes}" dist/* SHA256SUMS
        else
          gh release create "${TAG}" --draft --verify-tag --title "${TAG}" --generate-notes dist/* SHA256SUMS
        fi

  ci:publish:crate:
    desc: >-
      Publish the crate without compiling it again, and check that crates.io received the file that `cargo package`
      built before and CI attested; CI runs it when a release is published (CARGO_REGISTRY_TOKEN must be set)
    cmds:
      - |
        crate="$(ls target/package/chafernet-*.crate)"
        version="${crate##*/chafernet-}"
        version="${version%.crate}"
        attested="$(sha256sum < "${crate}" | cut -d' ' -f1)"
        cargo publish --no-verify --locked -p chafernet
        # cargo publish packages again rather than uploading that file, so compare what the registry recorded.
        published="$(curl -fsS -A "chafernet-ci (https://github.com/agency-fund/chafernet)" "https://crates.io/api/v1/crates/chafernet/${version}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"]["checksum"])')"
        if [ "${published}" != "${attested}" ]; then
          echo "::error::crates.io has a different chafernet ${version} than the file that was attested"
          exit 1
        fi

  gh:init:
    desc: Download the OpenTofu provider that .github/tf/gh.tf uses and point it at the state in TF_DIR (needs tofu)
    cmds:
      - tofu -chdir=.github/tf init -input=false -reconfigure -backend-config=path={{.TF_PATH}}/terraform.tfstate

  gh:validate:
    desc: Check the formatting and the validity of .github/tf/gh.tf; `task gh:init` comes first
    cmds:
      - tofu -chdir=.github/tf fmt -check -diff
      - tofu -chdir=.github/tf validate

  gh:plan:
    desc: Show what `task gh:apply` would change in the GitHub repository's settings
    interactive: true
    cmds:
      - tofu -chdir=.github/tf plan -var-file={{.TF_PATH}}/terraform.tfvars {{.CLI_ARGS}}

  gh:apply:
    desc: Apply .github/tf/gh.tf to the GitHub repository's settings, after showing the changes and asking
    interactive: true
    cmds:
      - tofu -chdir=.github/tf apply -var-file={{.TF_PATH}}/terraform.tfvars {{.CLI_ARGS}}

  gh:destroy:
    desc: >-
      Remove the settings of .github/tf/gh.tf from the GitHub repository, with the publishing environments and their
      secrets; refuses until `tofu state rm github_repository.this` has let go of the repository itself
    interactive: true
    cmds:
      - tofu -chdir=.github/tf destroy -var-file={{.TF_PATH}}/terraform.tfvars {{.CLI_ARGS}}
